<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九ナンプレ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-amber-50 text-slate-800 h-screen w-screen overflow-hidden flex flex-col justify-between p-2 select-none">

    <!-- ヘッダー -->
    <header class="text-center py-0.5">
        <h1 class="text-xl font-extrabold text-amber-800 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-calculator text-amber-600"></i> 九九ナンプレ
        </h1>
    </header>

    <!-- 段の選択 -->
    <div class="w-full max-w-md mx-auto bg-white rounded-xl p-1.5 shadow-sm border border-amber-200">
        <div class="flex gap-1 overflow-x-auto no-scrollbar" id="stageButtonsContainer"></div>
    </div>

    <!-- コントロールバー（タイマー削除） -->
    <div class="w-full max-w-md mx-auto flex items-center justify-between bg-white px-3 py-1 rounded-lg shadow-sm border border-slate-200 text-xs font-bold">
        <div class="flex items-center gap-1.5">
            <span class="text-slate-500"><i class="fa-solid fa-signal"></i> 難易度:</span>
            <select id="difficultySelect" class="bg-slate-100 border border-slate-300 rounded px-1.5 py-0.5 text-slate-700 focus:outline-none">
                <option value="easy">かんたん</option>
                <option value="medium" selected>ふつう</option>
                <option value="hard">むずかしい</option>
            </select>
        </div>
        <button id="btnNewGame" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white px-2.5 py-1 rounded text-xs font-bold transition flex items-center gap-1 shadow-sm">
            <i class="fa-solid fa-rotate-right"></i> 新しい問題
        </button>
    </div>

    <!-- 9x9 ナンプレ盤面（完全な正方形） -->
    <div class="w-full max-w-md mx-auto flex-1 flex items-center justify-center my-1 min-h-0">
        <div id="sudokuGrid" class="sudoku-grid bg-white"></div>
    </div>

    <!-- 回答入力ボタン（式のみ表記） -->
    <div class="w-full max-w-md mx-auto bg-white rounded-xl p-2 shadow-sm border border-slate-200 flex flex-col gap-1.5">
        <div class="grid grid-cols-3 gap-1.5" id="inputButtonsContainer"></div>
        <div class="flex gap-1.5">
            <button id="btnErase" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 active:scale-95 py-1.5 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-eraser"></i> 消去
            </button>
            <button id="btnCheck" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 active:scale-95 py-1.5 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-circle-check"></i> 答え合わせ
            </button>
        </div>
    </div>

    <!-- クリアモーダル -->
    <div id="victoryModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-5 max-w-xs w-full text-center shadow-2xl border-4 border-amber-400">
            <div class="w-12 h-12 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-2">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-800 mb-1">クリアおめでとう！</h2>
            <p class="text-slate-600 text-xs mb-3">見事に解き明かしました！</p>
            <button id="btnModalNext" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-2.5 rounded-xl shadow active:scale-95 transition text-sm">
                つぎの問題に挑戦！
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
